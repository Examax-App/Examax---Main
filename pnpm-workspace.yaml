# Packages allowed to run install scripts. esbuild ships its native binary
# that way (Remotion's bundler needs it); unrs-resolver is ESLint's resolver.
allowBuilds:
  esbuild: true
  unrs-resolver: true

# Patched versions of vulnerable transitive dev dependencies (ESLint's
# minimatch, Remotion Studio's config loader). None of these ship to the site.
overrides:
  "brace-expansion@<2": "1.1.21"
  "brace-expansion@>=4 <6": "5.0.12"
  "js-yaml@>=4 <4.3.2": "4.3.2"
